<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Canvas Note 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#D3D0C9;
  --stage-ink:#2E2C29;
  --stage-muted:#5E5A53;
  --ink-user:#24315E;
  --line:rgba(46,44,41,.18);
  --hand:'Nanum Pen Script',cursive;
  --ui:'IBM Plex Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--stage);color:var(--stage-ink);font-family:var(--ui);padding:36px 16px 56px}
main{max-width:1500px;margin:0 auto}
h1{font-family:var(--hand);font-weight:400;font-size:44px;line-height:1;color:var(--ink-user)}
.lead{margin-top:10px;max-width:72ch;font-size:14.5px;line-height:1.65;color:var(--stage-muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2fr);gap:24px;margin-top:28px;align-items:start}
.grid figure{display:flex;flex-direction:column;gap:10px}
.grid figure.wide{grid-column:auto}
iframe{width:100%;aspect-ratio:878/1238;border:0;background:transparent}
.wide iframe{aspect-ratio:1238/878}
figcaption{display:flex;flex-direction:column;gap:3px}
figcaption a{font-weight:600;font-size:15px;color:var(--stage-ink);text-decoration:none;border-bottom:1px solid var(--line);align-self:flex-start}
figcaption a:hover,figcaption a:focus-visible{border-bottom-color:var(--stage-ink);outline:none}
figcaption span{font-size:13px;line-height:1.55;color:var(--stage-muted)}
.flow{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.flow a{font-weight:600;color:var(--stage-ink)}
.flow span{font-size:13.5px;color:var(--stage-muted)}
@media (max-width:1100px){.grid{grid-template-columns:1fr 1fr}.grid figure.wide{grid-column:1/-1}}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>AI Canvas Note 시안</h1>
  <p class="lead">세 시안은 같은 필기, 같은 질문과 답을 담았다. 종이, 답이 놓이는 방식, 도구 막대 위치가 다르다. 각 화면에는 답을 받은 질문, 열린 이어 질문 칸, 방금 두 번 톡 해서 읽는 중인 문장이 함께 들어 있다.</p>

  <div class="grid">
    <figure>
      <iframe src="1030_v01_mockup-a-school-ruled.html?embed" title="시안 A 학교 괘선 노트" loading="lazy"></iframe>
      <figcaption><a href="1030_v01_mockup-a-school-ruled.html">시안 A. 학교 괘선 노트</a><span>답은 줄 위 갈색 인쇄체, 여백 도장과 연필선으로 연결. 위쪽 펜 트레이.</span></figcaption>
    </figure>
    <figure>
      <iframe src="1030_v01_mockup-b-grid-pad.html?embed" title="시안 B 방안 연습장" loading="lazy"></iframe>
      <figcaption><a href="1030_v01_mockup-b-grid-pad.html">시안 B. 방안 연습장</a><span>답은 테이프로 붙인 타자 쪽지, 이어 질문도 빈 쪽지에. 왼쪽 자 모양 막대.</span></figcaption>
    </figure>
    <figure class="wide">
      <iframe src="1030_v01_mockup-c-plain-spread.html?embed" title="시안 C 무지 펼침면" loading="lazy"></iframe>
      <figcaption><a href="1030_v01_mockup-c-plain-spread.html">시안 C. 무지 펼침면</a><span>가로 두 쪽, 연필 필기. 답은 각주 번호를 단 파란 인쇄체. 오른쪽 펜 홀더.</span></figcaption>
    </figure>
  </div>

  <p class="flow"><a href="1030_v01_mockup-flow-double-tap.html">두 번 톡 질문 흐름</a><span>필기 → 두 번 톡 → 범위 잡기 → 문장으로 좁히기 → 답 → 이어 질문, 그리고 필기와 헷갈리지 않게 하는 규칙.</span></p>
</main>
</body>
</html>
