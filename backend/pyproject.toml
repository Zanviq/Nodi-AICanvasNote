[project]
name = "ai-canvas-note-backend"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
"app/routers/*.py" = ["B008"]
